/* 细腻动效：仅装饰，不延迟操作 */
@keyframes cp-arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes cp-dialog{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes cp-glow{0%,100%{opacity:.48;transform:scale(1)}50%{opacity:.75;transform:scale(1.035)}}
header:after{animation:cp-glow 9s ease-in-out infinite}
main>.panel{animation:cp-arrive .42s cubic-bezier(.2,.7,.2,1) both}
.settings-dialog[open]{animation:cp-dialog .24s cubic-bezier(.2,.7,.2,1) both}
.settings-dialog::backdrop{backdrop-filter:blur(3px)}
.tabs button,.filter-values button,.trend-quick button{transition:background-color .2s ease,color .2s ease,box-shadow .2s ease,transform .2s ease}
.tabs button:not(.active):hover,.filter-values button:hover,.trend-quick button:hover{transform:translateY(-1px)}
.live-kpi,.live-block,.product-row,.source-row{transition:box-shadow .25s ease,border-color .25s ease,background-color .25s ease}
.live-kpi:hover,.live-block:hover{border-color:#cbded2;box-shadow:0 10px 25px #547b6912}
.source-row:hover{background:#f8fbf8}
.product-image{transition:filter .25s ease,box-shadow .25s ease}
.product-row:hover .product-image{filter:saturate(1.05);box-shadow:0 5px 16px #3a66531c}
.tablewrap tbody tr{transition:background-color .18s ease}
.tablewrap tbody tr:hover{background:#f3f9f5}
@media(prefers-reduced-motion:reduce){header:after,main>.panel,.settings-dialog[open]{animation:none!important}.tabs button,.filter-values button,.trend-quick button,.live-kpi,.live-block,.product-row,.source-row,.product-image,.tablewrap tbody tr{transition:none!important}}

 if(!colors.length&&!/仿|人造|合成|染色|镀色/.test(clues)){

// 导航绑定：放在 boot 里显式执行，避免依赖脚本尾部语句的执行顺序
function bindTabs(){
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
  if(state.tab===b.dataset.tab)return;
  state.tab=b.dataset.tab;state.sheet='';state.session='';state.query='';state.page=0;
  render();
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
   const content=document.querySelector('#content');
   if(content&&content.animate)content.animate([{opacity:.25,transform:'translateY(14px)'},{opacity:1,transform:'translateY(0)'}],{duration:380,easing:'cubic-bezier(.22,.7,.2,1)'});
   if(b.animate)b.animate([{transform:'scale(.94)'},{transform:'scale(1)'}],{duration:260,easing:'ease-out'});
  }
 });
}
async function boot(){
 try{
  const response=await fetch('/api/config',{cache:'no-store'});
  if(response.ok)applyConfig(await response.json());
 }catch(ex){/* 配置拿不到时保持空配置，界面会提示无法读取 */}
 bindTabs();
 // 深链接：?tab=catalog / ?tab=stock 可直接打开某个视图（便于分享和截图）
 const wanted=new URLSearchParams(location.search).get('tab');
 if(wanted&&Object.prototype.hasOwnProperty.call(specs,wanted))state.tab=wanted;
 sourceCards();render();Object.keys(specs).forEach(load);
}
boot();
